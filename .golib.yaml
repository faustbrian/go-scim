manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: FuzzUsersCorrectionQuery
        budget: 10s
        timeout: 60s
      - type: go-test
        packages: [.]
        fuzz: FuzzUsersCorrectionOperands
        budget: 10s
        timeout: 60s
  - module: postgres
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: FuzzConfiguredCredentialBounds
        budget: 3s
        timeout: 60s
      - type: go-test
        packages: [.]
        fuzz: FuzzOriginalMetadataEnvelope
        budget: 3s
        timeout: 60s
